version: '3.8'

services:
  rubato-app:
    build: .
    container_name: rubato-streamlit
    ports:
      - "8501:8501"
    environment:
      - PYTHONUNBUFFERED=1
      - TORCH_NUM_THREADS=2
      - OMP_NUM_THREADS=2
    volumes:
      - ./logs:/app/logs
      - /home/ubuntu/config/config.yaml:/app/config.yaml:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 30s
      retries: 3
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: 3G
        reservations:
          memory: 1G

