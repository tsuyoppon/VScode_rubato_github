# Streamlit credentials example file
# This is an example of how to configure credentials for Streamlit apps
# Copy this file to credentials.yaml and modify as needed

# For production deployments, you may want to configure:
# - Authentication tokens
# - API keys
# - Database credentials

# Example structure:
# api_keys:
#   openai: "your-api-key-here"
#   huggingface: "your-hf-token-here"
# 
# database:
#   host: "localhost"
#   port: 5432
#   username: "your-username"
#   password: "your-password"

# Note: Never commit actual credentials to version control
# Always use environment variables or secure credential management in production
